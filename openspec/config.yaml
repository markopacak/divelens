schema: spec-driven

context: |
  Product: DiveLens. Native Android app that auto-corrects underwater
  scuba photos AND videos (blue-green cast, missing red, flat contrast). Flow: one-tap
  auto-correct -> before/after compare -> fine-tune with sliders -> full-resolution export.
  Paid app with a free trial of N items via Google Play Billing. No accounts, no backend.

  Privacy (hard constraint): all processing on-device; media never leaves the device.
  Public claim is exactly "Photos and videos never leave your device." Never claim
  "no network permission": Play Billing may add permissions. Check the merged manifest.

  Stack (settled): Kotlin, Jetpack Compose, coroutines. minSdk 29 (Android 10).
  Photo Picker, androidx.exifinterface, MediaStore, Coil.
  applicationId com.markopacak.divelens must never change (it is fixed after publishing).

  Processing architecture (settled):
  - ONE GPU correction pipeline in GLSL ES 3.0, shared by photos and video.
    Photos: offscreen EGL rendering. Video: Media3 Transformer with a custom GlEffect
    for export; Media3 ExoPlayer with the same effect for live preview.
    No AGSL-only path, no RenderScript.
  - Auto-analysis (image statistics, parameter estimation) in plain Kotlin on a
    downscaled copy, in a pure JVM module (e.g. :core:analysis) unit-testable against
    reference images without an emulator. Add OpenCV only if CLAHE-style local
    contrast proves necessary.

  Correction pipeline (derived from 14 RefApp before/after pairs, 2026-10; see the
  auto-correction spec and tools/reference/). One colour matrix per image on encoded
  values, parameters estimated per image on a 200 px box-downscaled copy:
  1. Red rebuilt from green minus some blue: R' = R + a(G - beta*B) + gamma*a, with a
     from mean R/G and B/G. Red is never stretched on its own (that made open water red).
  2. Green and blue: levels stretch between a low percentile and the 99.9th percentile,
     gain capped at 3, black point at most 0.45 (bright open water is not turned black).
  3. Red is never lowered, except that dark water gets no red cast (red may not end
     above green there). RefApp reddens dark water at high strength; DiveLens must not.
  4. The colour shift is smoothed with a guided filter (coefficients on a 1024 px copy)
     so grain in flat water is not amplified; edges stay sharp.
  5. Strength s scales the colour shift (like the RefApp slider); one default.
  6. No sharpening, clarity or S-curve in auto-correction (RefApp shows none). No crop,
     rotation, vignette, or lens/fisheye correction.
  Coefficients come only from tools/reference/fit.py; never hand-tune them in code.
  Tuning reference: before/after pairs exported from RefApp (and one RefApp2);
  originals stay outside the repo (personal media, GPS metadata).

  Video: estimate parameters on frames sampled every N seconds, smooth them, and
  interpolate between samples (color drifts with depth; per-frame analysis flickers).
  Pass audio through unchanged; keep original creation date. Location is NOT kept in
  v1 exports (photos or videos): the system photo picker strips it, and reading it would
  need a broad media permission prompt. Originals keep their location.
  Long or 4K clips run in a foreground service with progress, cancel, and a
  free-storage check. Service type: mediaProcessing on Android 15+, dataSync on 10-14.
  HDR (10-bit HLG/PQ) input in v1: tone-map to SDR with Media3, then correct; export SDR.

  Billing: trial counter stored on device; gate checks happen at export. Purchases must
  be acknowledged within 3 days or Play refunds them automatically;
  verification is on-device. Billing only works once a build is on at least the
  internal testing track.

  Product decisions (2026-10-11):
  - Monetization: free download, one-time unlock (non-consumable in-app product).
    Restore the purchase from Play on reinstall or a new device; never charge twice.
  - Trial: N = 3 exports; a photo and a video each count as 1, whatever the length.
    Counter is stored locally (may reset on reinstall; accepted). No watermarking.
  - Batch processing IS in v1: the user can select and correct multiple items at once.
    Each item in a batch counts toward the trial.
  - The name "DiveLens" is final; keep the user-visible name in one string resource.

  Open source (hard constraint): the repository is public. Never commit credentials
  or sensitive data: signing keystores and passwords, Play Console service-account
  JSON, API tokens, or personal media/location data. Read them from outside the repo
  (gitignored local files such as keystore.properties, environment variables, or CI
  secrets) and document the expected names. Builds must work without them for
  contributors (debug signing, billing disabled or stubbed). Assume anyone can read
  and modify the code, including the on-device purchase checks (accepted).
  License: GPL-3.0-only with a section 7 exception for Google Play Billing / Play
  services libraries (see LICENSE and NOTICE). New dependencies must be
  GPLv3-compatible (Apache-2.0, MIT, BSD, LGPL are fine); flag anything else.

  Planned changes, in order (one capability per area):
  1 add-import-export (import-export), 2 add-auto-correction (auto-correction),
  3 add-preview-compare (preview-compare), 4 add-manual-adjustment (manual-adjustment),
  5 add-video-processing (video-processing), 6 add-help-and-legal (help-and-legal: gesture
  hints, tutorial, documentation, licence, terms of service, agreements),
  7 add-trial-and-purchase (licensing). The working-set limit of 20 (was 50) comes with change 5.
  After the Android release: an iPhone (iOS) app with the same features and privacy
  constraints; to be planned as its own project once Android has shipped.

  Out of scope for v1: RAW photos, cloud sync, social features, on-device ML models,
  lens/fisheye correction.
  Planned after v1: optional "keep location in exports" setting (document picker +
  ACCESS_MEDIA_LOCATION, off by default), only if users ask for it.
  Planned after v1: end-to-end HDR video (correct in 10-bit and export HDR instead of
  tone-mapping to SDR). Keep the v1 pipeline from blocking it (e.g. don't hard-code
  8-bit formats where a float or 10-bit path is just as easy).

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
